<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-in problem · {{ branding.app_name|default:"ServChart" }}</title>{% if branding.favicon_url %}
  <link rel="icon" href="{{ branding.favicon_url }}">{% endif %}
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --fg:#151a22; --muted:#5d6675; --line:#dfe3ea; --accent:#2563eb; --err:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --card:#171b23; --fg:#e7eaf0; --muted:#97a0ae; --line:#2a303b; --accent:#5b8cff; --err:#ff8a7a; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
    .card { max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
    h1 { margin:0 0 8px; font-size:20px; }
    p.msg { color:var(--err); }
    a { color:var(--accent); }
    .brand { display:flex; align-items:center; gap:10px; margin:0 0 4px; }
    .brand img { height:32px; max-width:140px; object-fit:contain; }
  </style>{% if branding.accent_color %}
  <style>:root { --accent: {{ branding.accent_color }}; }</style>{% endif %}
</head>
<body>
  <div class="card">
    <h1>Couldn't sign you in</h1>
    <p class="msg">{{ message }}</p>
    <p><a href="{% url 'login' %}">Back to sign-in</a></p>
  </div>
</body>
</html>
