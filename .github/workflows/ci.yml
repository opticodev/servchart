name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        working-directory: agent
        run: python -m unittest discover -s tests -v
      - name: Package builds
        working-directory: agent
        run: |
          pip install build
          python -m build
          pip install dist/*.whl
          servchart-agent --version

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r hub/requirements.txt
      - name: Django checks and tests
        working-directory: hub
        env:
          PYTHONPATH: ../agent
          SERVCHART_DATA_DIR: /tmp/servchart-ci
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test inventory -v 2

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: web
        run: |
          npm install
          npm run build

  images:
    runs-on: ubuntu-latest
    needs: [agent, hub, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Hub image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
      - name: Agent image builds
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: false
