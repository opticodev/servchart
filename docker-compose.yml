# Quick start:  docker compose up -d   ->  http://localhost:8484
# The admin password is printed in the logs on first start (docker compose logs hub),
# unless you set SERVCHART_ADMIN_PASSWORD below.
services:
  hub:
    image: opticodev/servchart-hub:latest
    build: .
    container_name: servchart-hub
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      # SERVCHART_ADMIN_PASSWORD: change-me
      # SERVCHART_PUBLIC_URL: https://servchart.example.com   # URL agents use to reach the hub
      # SERVCHART_CSRF_TRUSTED_ORIGINS: https://servchart.example.com
      # SERVCHART_DEMO: "1"                                   # also load fictional demo hosts
      SERVCHART_OBSERVE_CONNECTIONS: "1"                     # draw traffic between containers (needs pid: host)
      # SERVCHART_ALLOW_LOGS: "1"                             # let admins view this host's container logs
      # SERVCHART_SMTP_HOST: smtp.example.com                 # + _USER, _PASSWORD, _FROM: emailed reports
      TZ: UTC
    pid: host   # lets the hub see this host's containers' connections; remove to disable traffic lines
    volumes:
      - servchart-data:/data
      # Lets the hub map its own host. Remove this line to disable.
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  servchart-data:
